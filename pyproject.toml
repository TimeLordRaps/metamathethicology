[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metamathethicology"
version = "0.1.0.dev0"
description = "Ordinatics-first operation spaces for metamath, metaphysics, metaethics, and metalogic"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Tyler Roost"}]
dependencies = [
    "ordinatics @ git+https://github.com/TimeLordRaps/ordinatics.git@ef2cd7af7c07520d614ee407bc7982110f66295a",
    "hyperethics @ git+https://github.com/TimeLordRaps/hyperethics.git@51835e12a0674ab73cd6782d6f05697a47cdd933",
]

[project.optional-dependencies]
ecosystem = [
    "grounded-hypercalculi @ git+https://github.com/TimeLordRaps/grounded-hypercalculi.git@6eb5e0af1b7831fec887632d35814b78619cede3",
    "grounded-hyperset-theory @ git+https://github.com/TimeLordRaps/grounded-hyperset-theory.git@d7cb4372f65a8da2fe0817e6af7e975ce8f866b0",
    "hyperphysics @ git+https://github.com/TimeLordRaps/hyperphysics.git@66a86b97a587445218bab8f7f7a3abe853797988",
]
intellidynamics = [
    "hyperoptimization @ git+https://github.com/TimeLordRaps/hyperorganization.git@74ef2a9a592402972dd39dd7cf64f561bae1f050",
]
test = ["pytest>=8", "pytest-timeout>=2.3"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.11", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metamathethicology = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-vv -s --durations=10 --timeout=30"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
