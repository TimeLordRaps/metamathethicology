[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metamathethicology"
version = "0.1.0.dev0"
description = "Ordinatics-first operation spaces for metamath, metaphysics, metaethics, and metalogic"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Tyler Roost"}]
dependencies = [
    "ordinatics @ git+https://github.com/TimeLordRaps/ordinatics.git@ded754dd7b64410ee5c1ec0b0c47688c78fdcca1",
]

[project.optional-dependencies]
ecosystem = [
    "grounded-hypercalculi @ git+https://github.com/TimeLordRaps/grounded-hypercalculi.git@4018ac3086dc6ee1a223697711fb322e30cd0417",
    "grounded-hyperset-theory @ git+https://github.com/TimeLordRaps/grounded-hyperset-theory.git@9a86434450416cf135ca1e23aa5c04b511fdbee8",
]
test = ["pytest>=8", "pytest-timeout>=2.3"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.11", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metamathethicology = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-vv -s --durations=10 --timeout=30"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
